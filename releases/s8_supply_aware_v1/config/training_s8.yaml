# Effective S8 training config (frozen). Selected round = R2, lambda_accessibility = 1.0.
# Full provenance: config/student_s8.yaml (verbatim) + checkpoint 'config' key.
selected_round: R2
lambda_accessibility: 1.0
rounds:
- round: R1
  lambda_accessibility: 0.0
  best_epoch: 19
  output: outputs/student_s8_r1_lam0/
  note: 'accessibility KL-only fine-tune; rejected: within-curve sensitivity/monotonicity
    below teacher'
- round: R2
  lambda_accessibility: 1.0
  best_epoch: 26
  early_stop_epoch: 41
  output: outputs/student_s8/
  note: SELECTED final S8 (accessibility response loss L_accessibility added)
training:
  seed: 42
  batch_size: 32
  mechanism_batch_size: 8
  learning_rate: 0.000125
  weight_decay: 0.0001
  max_epochs: 120
  patience: 15
  early_stopping: selection guards + patience 15 (R2 stopped at epoch 41)
  replay_ratio: '2:1:1:1'
  replay_note: 'legacy : joint : mechanism : accessibility'
  accessibility_per_epoch: 52
  het_pairs_per_epoch: 52
loss:
  lambda_action: 1.0
  lambda_distribution: 1.0
  lambda_departure: 1.0
  lambda_elasticity: 0.0
  lambda_direction: 1.0
  lambda_magnitude: 1.0
  direction_margin: 0.0
  lambda_heterogeneity: 1.0
  huber_delta: 1.0
  lambda_mechanism: 1.0
  lambda_broken: 1.0
  lambda_accessibility: 1.0
  loss_note: L_accessibility = mean |E_T^acc - E_S^acc| over curve-group pairs (round
    2 only)
split:
  strategy: s8_triple_holdout
  persona_holdout: s7_s3c_convention (28/6/6, test personas never in train)
  od_holdout: true (train/val/test ODs disjoint 79/16/19)
  accessibility_holdout: walk_burden_15min (access+egress >= 15 min only in test)
init_from: releases/s7_w3_generic_core_v1/checkpoint/model.pt (FROZEN, byte-copied
  shared weights)
schema_case: Case B
arch_version: student_s8_v1
