# S7 mechanism-aware fine-tune — W1 (lambda_mechanism=0.25, lambda_broken=0.25).
#
# Fine-tunes the frozen C1 (S5 joint M2) checkpoint with the S7 loss
# L_S7 = L_base + lambda_mechanism * L_mechanism + lambda_broken * L_broken.
# Replay mix legacy : seen-joint : mechanism = 2 : 1 : 1 (S7 instruction §16).
# Teacher targets come exclusively from S6 data (no new API calls).
# LR = S5 LR (0.0005) x 0.25.

student:
  global_hidden_dim: 64
  alternative_hidden_dim: 32
  cat_embedding_dim: 8
  mode_embedding_dim: 8
  scorer_hidden_dim: 64
  dropout: 0.1

training:
  seed: 42
  batch_size: 32
  mechanism_batch_size: 8
  learning_rate: 0.000125     # S5 LR x 0.25 (targeted repair, gentle steps)
  weight_decay: 0.0001
  max_epochs: 120
  patience: 15
  replay_ratio: "2:1:1"       # legacy single-axis pairs : seen-joint pairs : mechanism quadruplets
  het_pairs_per_epoch: 52     # L_base heterogeneity replay (documented, same budget as mechanism)

loss:
  lambda_action: 1.0
  lambda_distribution: 1.0
  lambda_departure: 1.0
  lambda_elasticity: 0.0
  lambda_direction: 1.0
  lambda_magnitude: 1.0
  direction_margin: 0.0
  lambda_heterogeneity: 1.0
  huber_delta: 1.0
  lambda_mechanism: 0.25
  lambda_broken: 0.25

split:
  strategy: s3c_persona_holdout
  group_field: persona_group_id
